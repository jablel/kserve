# GitHub Action for uploading base coverage artifacts
# Used to store coverage reports for comparison in PRs
name: 'Upload Base Coverage'
description: 'Upload base branch coverage data for later comparison'

inputs:
  coverage-file:
    description: 'Path to the coverage file to upload'
    required: true
    default: 'coverage.out'
  retention-days:
    description: 'Number of days to retain the artifact'
    required: false
    default: '7'
  artifact-name:
    description: 'Name of the artifact to upload'
    required: false
    default: 'base-coverage'

runs:
  using: 'composite'
  steps:
    - name: Upload coverage artifact
      uses: actions/upload-artifact@v3
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.coverage-file }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
